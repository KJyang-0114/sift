name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: quality
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Verify dependencies
        run: go mod verify

      - name: Check formatting
        run: test -z "$(gofmt -l $(find . -name '*.go' -not -path './vendor/*'))"

      - name: Rule heuristic regressions
        run: python3 scripts/test-rule-heuristics.py

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./... -count=1

      - name: Race test
        run: go test -race ./... -count=1

      - name: Build
        run: go build ./cmd/sift/

      - name: Check GoReleaser config
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: check

      - name: Lint installer
        run: shellcheck install.sh

  docker:
    name: docker image
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Build image
        run: docker build --build-arg VERSION=ci --build-arg COMMIT="$GITHUB_SHA" -t sift:ci .

      - name: Scan a fixture inside the image
        run: |
          docker run --rm sift:ci --version | grep -F "sift version ci"
          docker run --rm --entrypoint semgrep sift:ci --version
          fixture="$RUNNER_TEMP/fixture"
          mkdir -p "$fixture"
          printf 'import os\n\ndef run(x):\n    os.system("ls " + x)\n' > "$fixture/app.py"
          git -C "$fixture" init -q
          git -C "$fixture" add .
          git -C "$fixture" -c user.name=ci -c user.email=ci@example.invalid -c commit.gpgsign=false commit -qm fixture
          docker run --rm -e SIFT_LLM_PROVIDER=offline -v "$fixture:/src" sift:ci scan . --format json > full.json
          echo 'print(1)' >> "$fixture/app.py"
          docker run --rm -e SIFT_LLM_PROVIDER=offline -v "$fixture:/src" sift:ci scan . --diff=HEAD --format json > diff.json
          python3 - <<'PY'
          import json
          for name in ("full.json", "diff.json"):
              report = json.load(open(name))
              assert report["status"] == "complete", (name, report["diagnostics"])
              assert any(f["rule"].endswith("command-injection-shell") for f in report["findings"]), (name, report["findings"])
          print("docker image scans complete with findings")
          PY

  install:
    name: install (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      SIFT_VERSION: v1.5.0
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install with install.sh
        if: runner.os != 'Windows'
        env:
          SIFT_INSTALL_DIR: ${{ runner.temp }}/bin
        run: |
          ./install.sh
          "$SIFT_INSTALL_DIR/sift" --version | grep -F "1.5.0"

      - name: Install with install.ps1
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          SIFT_INSTALL_DIR: ${{ runner.temp }}\bin
        run: |
          ./install.ps1
          $version = & (Join-Path $env:SIFT_INSTALL_DIR "sift.exe") --version
          if ($version -notmatch "1\.5\.0") { throw "unexpected version: $version" }

  build:
    name: build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Test platform filesystem and embedded rules
        run: go test ./internal/securepath ./internal/static ./internal/agent ./internal/cmd -count=1

      - name: Build
        run: go build ./cmd/sift/
