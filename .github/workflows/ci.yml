name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: quality
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Verify dependencies
        run: go mod verify

      - name: Check formatting
        run: test -z "$(gofmt -l $(find . -name '*.go' -not -path './vendor/*'))"

      - name: Rule heuristic regressions
        run: python3 scripts/test-rule-heuristics.py

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./... -count=1

      - name: Race test
        run: go test -race ./... -count=1

      - name: Build
        run: go build ./cmd/sift/

      - name: Check GoReleaser config
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: "~> v2"
          args: check

      - name: Lint installer
        run: shellcheck install.sh integrations/claude-code/*.sh

      - name: Claude Code hook behavior
        run: sh integrations/claude-code/test-sift-stop-hook.sh

  docker:
    name: docker image
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Build image
        run: docker build --build-arg VERSION=ci --build-arg COMMIT="$GITHUB_SHA" -t sift:ci .

      - name: Scan a fixture inside the image
        run: |
          docker run --rm sift:ci --version | grep -F "sift version ci"
          docker run --rm --entrypoint semgrep sift:ci --version
          fixture="$RUNNER_TEMP/fixture"
          mkdir -p "$fixture"
          printf 'import os\n\ndef run(x):\n    os.system("ls " + x)\n' > "$fixture/app.py"
          git -C "$fixture" init -q
          git -C "$fixture" add .
          git -C "$fixture" -c user.name=ci -c user.email=ci@example.invalid -c commit.gpgsign=false commit -qm fixture
          docker run --rm -e SIFT_LLM_PROVIDER=offline -v "$fixture:/src" sift:ci scan . --format json > full.json
          echo 'print(1)' >> "$fixture/app.py"
          docker run --rm -e SIFT_LLM_PROVIDER=offline -v "$fixture:/src" sift:ci scan . --diff=HEAD --format json > diff.json
          python3 - <<'PY'
          import json
          for name in ("full.json", "diff.json"):
              report = json.load(open(name))
              assert report["status"] == "complete", (name, report["diagnostics"])
              assert any(f["rule"].endswith("command-injection-shell") for f in report["findings"]), (name, report["findings"])
          print("docker image scans complete with findings")
          PY

  install:
    name: install (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      SIFT_VERSION: v1.5.0
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install with install.sh
        if: runner.os != 'Windows'
        env:
          SIFT_INSTALL_DIR: ${{ runner.temp }}/bin
        run: |
          ./install.sh
          "$SIFT_INSTALL_DIR/sift" --version | grep -F "1.5.0"

      - name: Install with install.ps1
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          SIFT_INSTALL_DIR: ${{ runner.temp }}\bin
        run: |
          # Run the way users do (irm | iex): twice, so the second run exercises the upgrade path.
          $ErrorActionPreference = "Continue"
          $ProgressPreference = "Continue"
          foreach ($run in 1..2) {
            Get-Content ./install.ps1 -Raw | Invoke-Expression
          }
          if ($ErrorActionPreference -ne "Continue" -or $ProgressPreference -ne "Continue") {
            throw "installer leaked preferences into the caller's session"
          }
          $version = & (Join-Path $env:SIFT_INSTALL_DIR "sift.exe") --version
          if ($version -notmatch "1\.5\.0") { throw "unexpected version: $version" }
          $leftovers = Get-ChildItem $env:SIFT_INSTALL_DIR -Force -Filter ".sift.exe.*"
          if ($leftovers) { throw "staging files left behind: $($leftovers.Name -join ', ')" }

  action:
    name: github action
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Create a fixture with one command injection
        run: |
          mkdir -p action-fixture
          printf 'import os\n\ndef run(x):\n    os.system("ls " + x)\n' > action-fixture/app.py

      - name: Gate blocks the new finding
        id: blocked
        continue-on-error: true
        uses: ./
        with:
          version: source
          path: action-fixture
          upload-sarif: "false"

      - name: Accept the finding in a baseline
        env:
          SIFT_LLM_PROVIDER: offline
        run: sift scan action-fixture --write-baseline sift-baseline.json --quiet

      - name: Gate passes with the baseline
        id: accepted
        uses: ./
        with:
          version: source
          path: action-fixture
          upload-sarif: "false"

      - name: Check action outputs
        env:
          BLOCKED_OUTCOME: ${{ steps.blocked.outcome }}
          BLOCKED_EXIT: ${{ steps.blocked.outputs.exit-code }}
          BLOCKED_FINDINGS: ${{ steps.blocked.outputs.findings }}
          ACCEPTED_EXIT: ${{ steps.accepted.outputs.exit-code }}
          ACCEPTED_FINDINGS: ${{ steps.accepted.outputs.findings }}
          SARIF_FILE: ${{ steps.accepted.outputs.sarif-file }}
        run: |
          echo "blocked: outcome=$BLOCKED_OUTCOME exit=$BLOCKED_EXIT findings=$BLOCKED_FINDINGS"
          echo "accepted: exit=$ACCEPTED_EXIT findings=$ACCEPTED_FINDINGS sarif=$SARIF_FILE"
          test "$BLOCKED_OUTCOME" = failure
          test "$BLOCKED_EXIT" = 1
          test "$BLOCKED_FINDINGS" -ge 1
          test "$ACCEPTED_EXIT" = 0
          test "$ACCEPTED_FINDINGS" = 0
          test -s "$SARIF_FILE"

  build:
    name: build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Test platform filesystem and embedded rules
        run: go test ./internal/securepath ./internal/static ./internal/agent ./internal/cmd -count=1

      - name: Build
        run: go build ./cmd/sift/
