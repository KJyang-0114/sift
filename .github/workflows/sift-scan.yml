name: Sift Security Scan

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sift-scan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sift-scan:
    name: Sift Code Security Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Scan this repository with the action from this commit
        uses: ./
        with:
          version: source
          fail-on: none
          category: sift
