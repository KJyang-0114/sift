name: Sift Security Scan
on:
  pull_request:
    branches: [main, master]
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  sift-scan:
    name: Sift Code Security Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Install Python (for semgrep)
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install semgrep
        run: pip3 install semgrep

      - name: Build Sift
        run: go build -o sift ./cmd/sift/

      - name: Run Sift once and retain its exit code
        id: scan
        env:
          SIFT_LLM_PROVIDER: offline
        run: |
          scan_status=0
          ./sift scan . --format sarif > sift-results.sarif || scan_status=$?
          if python3 -c 'import json; r=json.load(open("sift-results.sarif")); assert r["version"] == "2.1.0" and len(r["runs"]) == 1'; then
            echo "valid_report=true" >> "$GITHUB_OUTPUT"
          else
            echo "valid_report=false" >> "$GITHUB_OUTPUT"
            if [ "$scan_status" -eq 0 ]; then scan_status=4; fi
          fi
          echo "exit_code=$scan_status" >> "$GITHUB_OUTPUT"

      - name: Upload SARIF to GitHub
        if: ${{ !cancelled() && steps.scan.outputs.valid_report == 'true' }}
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: sift-results.sarif
          category: sift

      - name: Return Sift scan status
        if: ${{ !cancelled() && steps.scan.outputs.exit_code != '' }}
        env:
          SIFT_SCAN_EXIT_CODE: ${{ steps.scan.outputs.exit_code }}
        run: exit "$SIFT_SCAN_EXIT_CODE"
