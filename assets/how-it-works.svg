<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" width="1200" height="500" role="img" aria-labelledby="title desc">
  <title id="title">How Sift works</title>
  <desc id="desc">Code and lockfiles flow into three analyzers (Semgrep rules, dependency intelligence from OSV.dev and CISA KEV, and an optional LLM), then through a baseline and fail-on policy, and out to the terminal, GitHub Code Scanning, any CI, or a coding agent.</desc>
  <style>
    .bg { fill: #0d1117; }
    .frame { fill: none; stroke: #30363d; }
    .card { fill: #161b22; stroke: #30363d; stroke-width: 1.5; }
    .label { font: 600 12px -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; letter-spacing: 1.6px; fill: #8b949e; }
    .h { font: 600 18px -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; fill: #e6edf3; }
    .t { font: 14px -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; fill: #8b949e; }
    .m { font: 13px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #c9d1d9; }
    .arrow { stroke: #484f58; stroke-width: 2; fill: none; marker-end: url(#head); }
    .blue { fill: #58a6ff; } .amber { fill: #d29922; } .purple { fill: #bc8cff; } .green { fill: #3fb950; } .red { fill: #f85149; }
  </style>
  <defs>
    <marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#484f58"/>
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="1200" height="500" rx="16"/>
  <rect class="frame" x="0.5" y="0.5" width="1199" height="499" rx="16"/>

  <!-- Column labels -->
  <text class="label" x="40" y="52">INPUT</text>
  <text class="label" x="300" y="52">ANALYZE</text>
  <text class="label" x="660" y="52">DECIDE</text>
  <text class="label" x="920" y="52">DELIVER</text>

  <!-- Input -->
  <rect class="card" x="40" y="176" width="210" height="148" rx="12"/>
  <text class="h" x="62" y="214">Your code</text>
  <text class="t" x="62" y="244">working tree or --diff</text>
  <text class="t" x="62" y="268">human or agent edits</text>
  <text class="t" x="62" y="292">lockfiles</text>

  <!-- Analyzers -->
  <rect class="card" x="300" y="76" width="310" height="110" rx="12"/>
  <rect class="blue" x="300" y="76" width="4" height="110" rx="2"/>
  <text class="h" x="324" y="110">Rules</text>
  <text class="t" x="324" y="138">38 Semgrep rules, embedded</text>
  <text class="t" x="324" y="162">injection · XSS · SSRF · secrets · JWT</text>

  <rect class="card" x="300" y="200" width="310" height="110" rx="12"/>
  <rect class="amber" x="300" y="200" width="4" height="110" rx="2"/>
  <text class="h" x="324" y="234">Dependencies</text>
  <text class="t" x="324" y="262">OSV.dev CVEs · CISA KEV exploited</text>
  <text class="t" x="324" y="286">malicious &amp; hallucinated packages</text>

  <rect class="card" x="300" y="324" width="310" height="110" rx="12"/>
  <rect class="purple" x="300" y="324" width="4" height="110" rx="2"/>
  <text class="h" x="324" y="358">Semantic <tspan class="t">(optional)</tspan></text>
  <text class="t" x="324" y="386">your LLM key, or local Ollama</text>
  <text class="t" x="324" y="410">logic flaws · prompt injection</text>

  <!-- Policy -->
  <rect class="card" x="660" y="160" width="210" height="180" rx="12"/>
  <text class="h" x="682" y="198">Policy gate</text>
  <text class="m" x="682" y="232">--baseline</text>
  <text class="t" x="682" y="254">accept existing findings</text>
  <text class="m" x="682" y="288">--fail-on high</text>
  <text class="t" x="682" y="310">block only new ones</text>

  <!-- Outputs -->
  <rect class="card" x="920" y="76" width="240" height="76" rx="12"/>
  <text class="h" x="942" y="108">Terminal</text>
  <text class="t" x="942" y="132">readable report, exit code</text>

  <rect class="card" x="920" y="166" width="240" height="76" rx="12"/>
  <text class="h" x="942" y="198">SARIF</text>
  <text class="t" x="942" y="222">GitHub Code Scanning</text>

  <rect class="card" x="920" y="256" width="240" height="76" rx="12"/>
  <text class="h" x="942" y="288">JSON · Docker</text>
  <text class="t" x="942" y="312">GitLab, Jenkins, any CI</text>

  <rect class="card" x="920" y="346" width="240" height="76" rx="12"/>
  <circle class="green" cx="1138" cy="370" r="5"/>
  <text class="h" x="942" y="378">LLM format</text>
  <text class="t" x="942" y="402">your agent fixes it</text>

  <!-- Arrows: input to analyzers -->
  <path class="arrow" d="M250 250 C 275 250, 270 131, 296 131"/>
  <path class="arrow" d="M250 250 L 296 255"/>
  <path class="arrow" d="M250 250 C 275 250, 270 379, 296 379"/>
  <!-- analyzers to policy -->
  <path class="arrow" d="M610 131 C 640 131, 630 220, 656 220"/>
  <path class="arrow" d="M610 255 L 656 250"/>
  <path class="arrow" d="M610 379 C 640 379, 630 280, 656 280"/>
  <!-- policy to outputs -->
  <path class="arrow" d="M870 220 C 895 220, 890 114, 916 114"/>
  <path class="arrow" d="M870 235 C 893 235, 893 204, 916 204"/>
  <path class="arrow" d="M870 265 C 893 265, 893 294, 916 294"/>
  <path class="arrow" d="M870 280 C 895 280, 890 384, 916 384"/>

  <!-- Feedback loop from LLM output back to code -->
  <path d="M1040 422 V 448 Q 1040 456 1032 456 H 153 Q 145 456 145 448 V 330" stroke="#3fb950" stroke-width="1.5" stroke-dasharray="5 5" fill="none" marker-end="url(#loop)"/>
  <defs>
    <marker id="loop" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#3fb950"/>
    </marker>
  </defs>
  <text class="t" x="592" y="482" text-anchor="middle" style="fill:#3fb950">fix loop: the agent edits until the gate passes</text>
</svg>
