<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" width="900" height="520" role="img" aria-labelledby="title desc">
  <title id="title">Sift terminal output</title>
  <desc id="desc">A scan with a baseline hides 14 accepted findings and reports two new ones: a SQL injection and a lodash dependency with CVE-2021-23337. The fail-on high gate blocks the scan with exit code 1.</desc>
  <style>
    .bg { fill: #0d1117; }
    .bar { fill: #161b22; }
    .frame { fill: none; stroke: #30363d; }
    text { font: 14px ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; fill: #c9d1d9; white-space: pre; }
    .dim { fill: #8b949e; }
    .rule { fill: #30363d; }
    .prompt { fill: #3fb950; }
    .cmd { fill: #e6edf3; }
    .crit { fill: #f85149; font-weight: 700; }
    .high { fill: #d29922; font-weight: 700; }
    .title { fill: #e6edf3; font-weight: 700; }
    .ok { fill: #3fb950; }
    .err { fill: #f85149; }
    .key { fill: #8b949e; }
  </style>

  <rect class="bg" x="0" y="0" width="900" height="520" rx="12"/>
  <path class="bar" d="M12 0 H888 A12 12 0 0 1 900 12 V40 H0 V12 A12 12 0 0 1 12 0 Z"/>
  <rect class="frame" x="0.5" y="0.5" width="899" height="519" rx="12"/>
  <circle cx="22" cy="20" r="6" fill="#f85149"/>
  <circle cx="42" cy="20" r="6" fill="#d29922"/>
  <circle cx="62" cy="20" r="6" fill="#3fb950"/>
  <text class="dim" x="450" y="25" text-anchor="middle" style="font-size:12px">shop-api — zsh</text>

  <text x="24" y="74"><tspan class="prompt">❯</tspan><tspan class="cmd"> sift scan . --baseline sift-baseline.json --fail-on high</tspan></text>

  <text class="rule" x="24" y="104">────────────────────────────────────────────────────────────────────────────────────────────</text>
  <text x="24" y="126"><tspan class="title">Sift Scan Report</tspan><tspan class="dim"> · shop-api · 2.8s · status: </tspan><tspan class="ok">complete</tspan></text>
  <text class="dim" x="24" y="148">Suppressed: 14 accepted finding(s) hidden (see JSON/SARIF report)</text>
  <text x="24" y="170"><tspan class="crit">● Critical: 1</tspan><tspan>   </tspan><tspan class="high">● High: 1</tspan><tspan class="dim">   ● Medium: 0   ● Low: 0</tspan></text>
  <text class="rule" x="24" y="192">────────────────────────────────────────────────────────────────────────────────────────────</text>

  <text x="24" y="226"><tspan class="crit">● CRITICAL</tspan><tspan class="title">  sift.sql-injection-concat</tspan></text>
  <text x="48" y="250"><tspan class="key">File   </tspan>api/orders.py:42</text>
  <text x="48" y="272"><tspan class="key">Code   </tspan>db.execute("SELECT * FROM orders WHERE id = " + order_id)</text>
  <text x="48" y="294"><tspan class="key">Issue  </tspan>SQL built by string concatenation</text>
  <text x="48" y="316"><tspan class="key">CWE    </tspan>CWE-89</text>

  <text x="24" y="350"><tspan class="high">● HIGH</tspan><tspan class="title">  sift.vulnerable-dependency</tspan></text>
  <text x="48" y="374"><tspan class="key">File   </tspan>package-lock.json:318</text>
  <text x="48" y="396"><tspan class="key">Issue  </tspan>[CVE-2021-23337] lodash@4.17.20 (npm): Command Injection</text>
  <text x="48" y="418"><tspan class="key">Fix    </tspan>Upgrade lodash to a fixed version (4.17.21)</text>

  <text class="rule" x="24" y="448">────────────────────────────────────────────────────────────────────────────────────────────</text>
  <text class="err" x="24" y="474">gate: 2 finding(s) at or above high block this scan</text>
  <text x="24" y="498"><tspan class="prompt">❯</tspan><tspan class="dim"> echo $?  </tspan><tspan class="err">1</tspan></text>
</svg>
