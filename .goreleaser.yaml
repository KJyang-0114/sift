# Sift — GoReleaser 配置
# push v* tag 時由 .github/workflows/release.yml 建置多平台 binary + GitHub Release。
# 本機預覽：make snapshot

version: 2

before:
  hooks:
    - go mod verify

builds:
  - id: sift
    main: ./cmd/sift/
    binary: sift
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{.Version}} -X main.commit={{.FullCommit}} -X main.date={{.Date}}
    mod_timestamp: "{{ .CommitTimestamp }}"

archives:
  - formats: [tar.gz]
    name_template: >-
      sift_{{ .Os }}_{{ .Arch }}
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - LICENSE
      - README.md
      - MIGRATION.md
      - CHANGELOG.md

checksum:
  name_template: "checksums.txt"
  algorithm: sha256

sboms:
  - artifacts: archive

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  disable: true

release:
  github:
    owner: KJyang-0114
    name: sift
  draft: false
  prerelease: auto
