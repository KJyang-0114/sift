rules:
  - id: sift.frontend-dangerouslySetInnerHTML
    message: |
      [XSS] dangerouslySetInnerHTML renders user input directly, which may lead to XSS.
      Use DOMPurify or avoid injecting raw HTML directly.
    severity: HIGH
    languages:
      - javascript
      - typescript
    patterns:
      - pattern: dangerouslySetInnerHTML
    metadata:
      confidence: LOW
      category: security
      cwe: "CWE-79"

  - id: sift.frontend-innerHTML
    message: |
      [XSS] innerHTML/outerHTML/document.write may inject malicious scripts.
      Use textContent instead or sanitize input first.
    severity: MEDIUM
    languages:
      - javascript
      - typescript
    patterns:
      - pattern-either:
          - pattern: $EL.innerHTML = $INPUT
          - pattern: document.write($INPUT)
    metadata:
      confidence: LOW
      category: security
      cwe: "CWE-79"

  - id: sift.frontend-eval
    message: |
      [XSS] eval() can execute arbitrary JavaScript.
    severity: HIGH
    languages:
      - javascript
      - typescript
    patterns:
      - pattern: eval($INPUT)
    metadata:
      confidence: MEDIUM
      category: security
      cwe: "CWE-95"

  - id: sift.frontend-localStorage
    message: |
      [Security] localStorage should not store sensitive data (tokens, passwords).
      Use httpOnly cookies instead.
    severity: MEDIUM
    languages:
      - javascript
      - typescript
    # Only keys or values that look like credentials; preferences such as a theme are fine.
    pattern-either:
      - patterns:
          - pattern-either:
              - pattern: localStorage.setItem($K, $V)
              - pattern: sessionStorage.setItem($K, $V)
          - metavariable-regex:
              metavariable: $K
              regex: (?i).*(token|jwt|secret|passw|credential|api_?key|apikey|auth|session).*
      - patterns:
          - pattern-either:
              - pattern: localStorage.setItem($K, $V)
              - pattern: sessionStorage.setItem($K, $V)
          - metavariable-regex:
              metavariable: $V
              regex: (?i).*(token|jwt|secret|passw|credential|api_?key|apikey).*
    metadata:
      confidence: MEDIUM
      category: security
      cwe: "CWE-922"

  - id: sift.frontend-open-redirect
    message: |
      [Security] window.location using a user-controllable URL may lead to open redirect.
    severity: MEDIUM
    languages:
      - javascript
      - typescript
    patterns:
      - pattern-either:
          - pattern: window.location.href = $U
          - pattern: window.location.replace($U)
    metadata:
      confidence: LOW
      category: security
      cwe: "CWE-601"
