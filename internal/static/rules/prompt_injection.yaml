rules:
  - id: sift.prompt-injection-risk
    message: |
      [LLM Review] LLM API call detected; review how untrusted input is isolated.
      Separate user input from system instructions in the prompt.
    severity: WARNING
    languages:
      - python
      - javascript
      - typescript
      - go
    patterns:
      - pattern-regex: (\.chat\.completions\.create\s*\(|\.messages\.create\s*\()
    metadata:
      category: security
      cwe: "CWE-77"
      owasp: "LLM01:2025 - Prompt Injection"
