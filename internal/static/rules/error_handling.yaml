rules:
  - id: sift.error-stack-trace-leak
    message: |
      [Error Handling] Error messages returned directly to the client may leak internal information.
      In production, log errors only and return a generic error response.
    severity: MEDIUM
    languages:
      - python
      - javascript
      - typescript
      - go
    patterns:
      # Error details sent to the client; returning err.Error() inside a program is not a leak.
      - pattern-regex: (\.(?:send|json|end|write)\([^\n]*\b(?:err|error|e|ex)\.(?:stack|message)\b|\.send\(\s*(?:err|error)\s*\)|http\.Error\([^,\n]+,\s*err\.Error\(\)|jsonify\([^\n]*str\(\s*(?:e|err|exc|error)\s*\))
    metadata:
      confidence: MEDIUM
      category: security
      cwe: "CWE-209"

  - id: sift.error-unhandled-rejection
    message: |
      [Reliability] This unhandledRejection handler discards the error, hiding failures.
      Log the reason and exit, or let the process crash so it can be restarted.
    severity: LOW
    languages:
      - javascript
      - typescript
    patterns:
      - pattern-either:
          - pattern: process.on("unhandledRejection", () => {})
          - pattern: process.on("unhandledRejection", ($R) => {})
          - pattern: process.on("unhandledRejection", function () {})
          - pattern: process.on("unhandledRejection", function ($R) {})
    metadata:
      confidence: HIGH
      category: reliability
