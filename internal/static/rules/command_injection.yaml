rules:
  - id: sift.command-injection-shell
    message: |
      [Command Injection] Shell command execution detected.
      Avoid shell=True; use argument arrays or strictly validate input.
    severity: ERROR
    languages:
      - python
      - javascript
      - typescript
      - go
      - java
      - ruby
      - php
    patterns:
      - pattern-regex: (os\.system\s*\(|subprocess\.[A-Za-z_]+\s*\([^\n]*shell\s*=\s*True|child_process\.exec\s*\(|shell_exec\s*\()
    metadata:
      category: security
      cwe: "CWE-78"
